schema_version: 1
rules_version: "1.1.0-draft-fault-menu"
owner: "成员C"
approval_status: "draft_member_c_owned"
change_policy:
  sole_approver: "成员C"
  implementers_must_not_override: true
  required_evidence:
    - rules_version
    - rules_sha256
    - firmware_revision
    - fpga_revision
    - bit_hdf_elf_hashes

event_abi:
  width_bits: 128
  word_order: "word0=[31:0], word3=[127:96]"
  fields:
    timestamp: "[127:64]"
    protocol_id: "[63:60]"
    channel_id: "[59:56]"
    direction: "[55:54]"
    event_type: "[53:48]"
    flags_data: "[47:32]"
    data_length: "[31:24]"
    transaction_id: "[23:0]"
  protocol_ids:
    virtual: 0
    uart: 1
    spi: 2
    i2c: 3
    can: 4
  event_types:
    start: 0
    data: 1
    end: 2
    error: 63
    reserved_extension_range: "0x03..0x3E"
  handshake:
    transfer_condition: "evt_valid && evt_ready"
    hold_when_blocked:
      - evt_data
      - evt_trigger

protocols:
  spi:
    enabled: true
    role_under_test: "stm32_master_w25q128_slave_fpga_passive_monitor"
    mode: 0
    bit_order: "msb_first"
    initial_sclk_hz: 1000000
    transaction_boundary: "CS falling edge to CS rising edge"
    data_event:
      flags_data_15_8: "MISO"
      flags_data_7_0: "MOSI"
      data_length: 2
    errors:
      incomplete_byte: "CS rises when sampled_bit_count is not 0 modulo 8"
      truncated_event: "capture ends before transaction END is recorded"
    triggers:
      - name: "jedec_id_command"
        match_mosi: "0x9F"
      - name: "incomplete_byte"
        match_error: "incomplete_byte"
    cases:
      - case_id: 1001
        name: "w25q128_jedec_id"
        tx_hex: "9F000000"
        expected_rx_payload: "must_match_actual_mounted_part"
        reference_example_hex: "EF4018"
        must_verify_actual_device: true
        smoke_iterations: 10
        acceptance_iterations: 1000
      - case_id: 1002
        name: "fixed_patterns"
        tx_hex: "00FF55AA"
      - case_id: 1091
        name: "cs_incomplete_byte"
        fault: "emit_1_to_7_valid_bits_then_release_cs"
        acceptance_iterations: 100
      - case_id: 1092
        name: "jedec_short_transaction"
        tx_hex: "9F00"
        classification: "expected_transaction_mismatch_not_spi_line_error"
      - case_id: 1093
        name: "jedec_extra_byte"
        tx_hex: "9F00000000"
        classification: "expected_transaction_mismatch_not_spi_line_error"
      - case_id: 1094
        name: "miso_comparison"
        classification: "observe_only_requires_external_fault_or_wrong_expected_value"

  uart:
    enabled: true
    baudrate: 115200
    data_bits: 8
    parity: "none"
    stop_bits: 1
    transaction_boundary: "test case length or configured idle gap"
    errors:
      framing_error: "sampled stop bit is low"
      timeout: "expected response not received before case timeout"
    cases:
      - case_id: 2001
        name: "eight_byte_loopback"
        payload_rule: "incrementing bytes"
        smoke_iterations: 10
        acceptance_iterations: 1000
      - case_id: 2091
        name: "bad_stop_bit"
        method: "PD8_GPIO_bitbang_one_0x55_frame_stop_low"
      - case_id: 2092
        name: "break"
        method: "PD8_low_13_bit_times"
      - case_id: 2093
        name: "baud_mismatch"
        method: "send_0x55_at_96000_then_restore_115200"
        classification: "may_cause_decode_mismatch_or_framing_error"
      - case_id: 2094
        name: "missing_bytes"
        method: "send_3_of_expected_8_bytes"
        classification: "expected_transaction_timeout_not_bad_uart_frame"
      - case_id: 2095
        name: "parity_error"
        availability: "not_in_8N1_baseline"

  i2c:
    enabled: true
    bitrate_hz: 100000
    address_mode: "7bit"
    eeprom_address_7bit: "0x50"
    transaction_boundary: "START or repeated START through STOP"
    events_required:
      - start
      - repeated_start
      - address
      - read_write
      - data
      - ack_nack
      - stop
    errors:
      nack: "SDA remains high during ACK clock"
      illegal_transition: "SDA changes while SCL high outside START/STOP"
    cases:
      - case_id: 3001
        name: "at24c256_write_read"
        memory_address: "0x0100"
        length: 16
        acceptance_iterations: 1000
      - case_id: 3091
        name: "missing_address_nack"
        address_7bit: "0x51"
        expected: "nack"
      - case_id: 3092
        name: "write_cycle_busy_nack"
        method: "write_one_byte_then_ack_poll"
        note: "nack_count_is_measured_not_assumed"
      - case_id: 3093
        name: "sda_stuck_low"
        availability: "requires_PC7_open_drain_jumper_to_SDA_and_build_option"
      - case_id: 3094
        name: "scl_stuck_low"
        availability: "requires_PC8_open_drain_jumper_to_SCL_and_build_option"
      - case_id: 3095
        name: "delayed_stop"
        method: "bitbang_address_then_hold_SCL_low_30ms_then_recover_with_STOP"
        classification: "bounded_timeout_window_not_permanent_bus_fault"

  can:
    enabled: false
    enable_gate: "member_c_approves_after_transceiver_emio_termination_check"
    bitrate_hz: 500000
    frame_format: "standard_11bit"
    timestamp_classification: "PS software timestamp until PL RXD timestamp exists"
    cases:
      - case_id: 4001
        name: "standard_frame_echo"
        standard_id: "0x321"
        dlc: 8
        payload_rule: "incrementing bytes"
        smoke_iterations: 10
        acceptance_iterations: 1000
      - case_id: 4091
        name: "no_ack_probe"
        availability: "requires_transceiver_and_no_acknowledging_peer"
        method: "one_shot_NART_send_then_restore_auto_retransmission"
      - case_id: 4092
        name: "bit_error"
        availability: "external_physical_injector_required"
      - case_id: 4093
        name: "stuff_error"
        availability: "external_physical_injector_required"
      - case_id: 4094
        name: "crc_error"
        availability: "external_physical_injector_required"
      - case_id: 4095
        name: "form_error"
        availability: "external_physical_injector_required"
      - case_id: 4096
        name: "bus_off"
        availability: "requires_repeated_external_bus_fault_and_recovery_plan"

acceptance:
  event_missing: 0
  event_duplicate: 0
  known_corpus_parse_errors: 0
  continuous_run_hours: 2
  fpga_wns_requirement: ">0"
  drc_errors: 0
